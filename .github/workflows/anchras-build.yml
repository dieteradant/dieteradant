name: Anchras Build

run-name: anchras-${{ inputs.anchras_run_id }}

on:
  workflow_dispatch:
    inputs:
      anchras_run_id:
        description: Anchras build-run UUID used for exact provider correlation
        required: true
        type: string
      anchras_commit_sha:
        description: Exact source commit to build
        required: true
        type: string
      anchras_artifact_repository:
        description: Exact OCI repository that must receive the image
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.anchras_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable fixture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ inputs.anchras_artifact_repository }}:anchras-${{ inputs.anchras_run_id }}

      - name: Write strict Anchras result
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ inputs.anchras_artifact_repository }}
        run: |
          set -euo pipefail
          printf '{"image_digest_ref":"%s@%s"}\n' "${IMAGE_REPOSITORY}" "${IMAGE_DIGEST}" > anchras-result.json

      - name: Upload strict Anchras result
        uses: actions/upload-artifact@v4
        with:
          name: anchras-build-result
          path: anchras-result.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

